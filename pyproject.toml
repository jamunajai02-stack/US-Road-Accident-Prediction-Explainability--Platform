[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accident-prediction-platform"
version = "0.1.0"
description = "Production-grade Spatio-Temporal US Road Accident Prediction & Explainability Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "h3>=3.7.6",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "fastparquet>=2023.10.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "networkx>=3.2",
    "shapely>=2.0.0",
    "geopandas>=0.14.0",
    "scikit-learn>=1.4.0",
    "torch>=2.1.0",
    "torch-geometric>=2.4.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "respx>=0.20.2",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]
geo = [
    "osmnx>=1.9.0",
    "pyrosm>=0.6.2",
]
kafka = [
    "aiokafka>=0.10.0",
    "confluent-kafka>=2.3.0",
]
db = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.14.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["libs*", "modules*", "services*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
    "modules/phase0_5_graph_extraction/tests",
    "modules/phase1_data_infra/tests",
    "modules/phase2_graph_construction/tests",
    "modules/phase3_predictive_core/tests",
    "modules/phase4_explainability/tests",
    "modules/phase5_realtime_service/tests",
    "services/api_gateway/tests",
]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
